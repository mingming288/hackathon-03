version: '3.8'

services:
  poster-agent:
    build: .
    ports:
      - "8766:8766"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - IMAGE_API_KEY=${IMAGE_API_KEY}
      - IMAGE_BASE_URL=${IMAGE_BASE_URL:-https://www.llmgateway.cn}
      - IMAGE_MODEL=${IMAGE_MODEL:-gpt-image-2}
      - IMAGE_PATH=${IMAGE_PATH:-/v1/images/generations}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_BUCKET=${SUPABASE_BUCKET:-posters}
      - PORT=8766
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      - ENV=production
      - LOG_LEVEL=INFO
    volumes:
      - poster-outputs:/app/server/outputs
      - poster-uploads:/app/server/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8766/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  poster-outputs:
  poster-uploads:
